name: SwiftyApp

options:
  bundleIdPrefix: com.quacky
  deploymentTarget:
    iOS: "18.0"

targets:
  SwiftyApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: ContentView.swift
      - path: SwiftyAppApp.swift

    resources:
      - path: A90JUMPSCARE.png

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quacky.iOsApp

        GENERATE_INFOPLIST_FILE: "YES"

        INFOPLIST_KEY_CFBundleDisplayName: Videos

        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"

        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
