name: SwiftyApp
options:
  bundleIdPrefix: com.quacky
  deploymentTarget:
    iOS: "26.0"

targets:
  # 1. Main iOS Application 📱
  iOsApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ContentView.swift
      - path: SwiftyAppApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quacky.iOsApp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: SwiftyApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "This app needs your location to display the local map detail."
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
