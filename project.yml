name: iOsApp
options:
  bundleIdPrefix: com.quacky
  deploymentTarget:
    iOS: "26.0"

targets:
  iOsApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ContentView.swift
      - path: iOsAppApp.swift
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quacky.iOsApp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: SwiftyApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIDesignRequiresCompatibility: true
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
