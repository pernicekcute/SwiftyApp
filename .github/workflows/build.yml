name: Build iOsApp IPA 🚀

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repozitáře 📥
        uses: actions/checkout@v4

      - name: Instalace XcodeGen 🛠️
        run: brew install xcodegen

      - name: Generování Xcode Projektu (iOsApp.xcodeproj) 🏗️
        run: xcodegen generate

      - name: Sestavení iOS aplikace (.app) 📱
        run: |
          xcodebuild build \
            -project iOsApp.xcodeproj \
            -scheme iOsApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Vytvoření iOsApp.ipa balíčku 📦
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/iOsApp.app Payload/
          zip -r iOsApp.ipa Payload

      - name: Nahrání iOsApp.ipa do GitHub Artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: iOsApp-IPA
          path: iOsApp.ipa
