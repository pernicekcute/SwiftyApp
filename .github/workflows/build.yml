name: Build iOS App 🚀

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repozitáře 📥
        uses: actions/checkout@v4

      - name: Nastavení Xcode 🛠️
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Sestavení iOS aplikace (.ipa / .app) 🏗️
        run: |
          xcodebuild build \
            -scheme "MyApp" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Nahrání artefaktu do GitHub Releases / Artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Build
          path: build/Release-iphoneos/*.app
