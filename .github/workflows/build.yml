```yaml
name: Build App and IPA

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Clean
        run: |
          xcodebuild clean \
            -project SwiftyApp.xcodeproj \
            -scheme SwiftyApp \
            -configuration Release

      - name: Archive
        run: |
          set -e

          xcodebuild archive \
            -project SwiftyApp.xcodeproj \
            -scheme SwiftyApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SwiftyApp.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find application
        run: |
          set -e

          APP_DIR="$RUNNER_TEMP/SwiftyApp.xcarchive/Products/Applications"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No .app was produced."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "APP_NAME=$(basename "$APP_PATH")" >> "$GITHUB_ENV"

      - name: Create IPA
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          zip -qry \
            "SwiftyApp-${GITHUB_SHA::7}-unsigned.ipa" \
            Payload

      - name: Create APP ZIP
        run: |
          set -e

          cd "$(dirname "$APP_PATH")"

          zip -qry \
            "$RUNNER_TEMP/SwiftyApp-${GITHUB_SHA::7}.app.zip" \
            "$APP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwiftyApp-Build-Files
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/SwiftyApp-*.ipa
            ${{ runner.temp }}/SwiftyApp-*.app.zip
```
