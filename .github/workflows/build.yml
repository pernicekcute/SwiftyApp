name: Build SwiftyApp IPA 🚀

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repozitáře 📥
        uses: actions/checkout@v4

      - name: Instalace XcodeGen 🛠️
        run: brew install xcodegen

      - name: Generování Xcode Projektu (SwiftyApp.xcodeproj) 🏗️
        run: xcodegen generate

      - name: Archivace iOS aplikace (.app) 📱
        run: |
          xcodebuild archive \
            -project SwiftyApp.xcodeproj \
            -scheme SwiftyApp \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/SwiftyApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_SIGN_INPUTS=NO

      - name: Vytvoření SwiftyApp.ipa balíčku 📦
        run: |
          mkdir -p Payload
          cp -r build/SwiftyApp.xcarchive/Products/Applications/SwiftyApp.app Payload/
          zip -r SwiftyApp.ipa Payload

      - name: Nahrání SwiftyApp.ipa do GitHub Artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: SwiftyApp
          path: SwiftyApp.ipa
