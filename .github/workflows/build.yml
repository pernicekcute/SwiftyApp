name: Build and Release App and IPA

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project SwiftyApp.xcodeproj \
            -scheme iOsApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SwiftyApp.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app and .ipa
        run: |
          # Package .app bundle into a .zip
          cd "$RUNNER_TEMP/SwiftyApp.xcarchive/Products/Applications"
          zip -qry "$RUNNER_TEMP/SwiftyApp-${GITHUB_SHA::7}.app.zip" SwiftyApp.app

          # Package .ipa payload
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R SwiftyApp.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "SwiftyApp-${GITHUB_SHA::7}-unsigned.ipa" Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwiftyApp-Build-Files
          path: |
            ${{ runner.temp }}/*.app.zip
            ${{ runner.temp }}/*.ipa

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SwiftyApp ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/*.app.zip
            ${{ runner.temp }}/*.ipa
